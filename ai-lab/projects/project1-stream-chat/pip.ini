; pip mirror config for this project (ASCII only, on purpose)
;
; Why ASCII-only: pip reads its config file with the system locale encoding.
; On Chinese Windows that is cp936/GBK, and non-ASCII comments make pip fail with
;   "Configuration file contains invalid cp936 characters in pip.ini"
; So: keep this file ASCII. Chinese explanation lives in README.md instead.
;
; Why this file exists at all: pypi.org is unreachable on some networks (it hung
; for minutes in this project). The Tsinghua mirror works. Keeping the config in
; the repo means you do not have to write the user-level pip.ini -- which can fail
; with PermissionError in restricted environments.
;
; Usage:
;   $env:PIP_CONFIG_FILE = "G:\转型\ai-lab\projects\project1-stream-chat\pip.ini"
;   G:\转型\.venv\Scripts\python -m pip install -r requirements.txt
;
; Or one-off on the command line:
;   python -m pip install --index-url https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt

[global]
index-url = https://pypi.tuna.tsinghua.edu.cn/simple
trusted-host = pypi.tuna.tsinghua.edu.cn
timeout = 30
